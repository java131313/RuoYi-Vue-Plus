name: docker

# 构建 RuoYi-Vue-Plus Rust 版一体化镜像（前端 + 后端 + SQLite）并推送 GHCR。
#
# 触发：push 到 5.X 且改动 ruoyi-rs/ 或工作流自身、打 v* tag、手动触发。
# PR 只构建不推送。镜像：ghcr.io/<owner>/ruoyi-vue-plus-rs

on:
  push:
    branches: ["5.X"]
    tags: ["v*"]
    paths: ["ruoyi-rs/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["ruoyi-rs/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # 说明：arm64 的 Rust 编译在 QEMU 下较慢（首次约 20-40 分钟），
      # 缓存命中后会明显加快。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ruoyi-rs
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ruoyi-rs
          cache-to: type=gha,mode=max,scope=ruoyi-rs
