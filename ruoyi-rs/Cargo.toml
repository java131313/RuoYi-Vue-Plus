[package]
name = "ruoyi-rs"
version = "5.6.1-rust"
edition = "2021"
description = "Rust rewrite of RuoYi-Vue-Plus core system module (axum + SQLite)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonwebtoken = "9"
bcrypt = "0.17"
rsa = "0.9"
aes = "0.8"
rand = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
base64 = "0.22"

[profile.release]
opt-level = 2
strip = true
lto = false
