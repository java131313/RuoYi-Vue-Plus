# 纯后端运行：镜像不再内置前端（前端由 GitHub Pages 部署，见 .github/workflows/pages.yml）。
# 本服务自带 SQLite，无需 MySQL/Redis；CORS_ORIGIN 按你的前端来源填写。
services:
  ruoyi-rs:
    image: ghcr.io/java131313/ruoyi-vue-plus-rs:latest
    container_name: ruoyi-rs
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # JWT_SECRET: 请在生产环境覆盖默认值
      # CAPTCHA_ENABLED: "true"
    volumes:
      - ruoyi-data:/ruoyi/data
    restart: unless-stopped

volumes:
  ruoyi-data:
